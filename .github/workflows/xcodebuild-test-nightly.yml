name: Xcode Nightly Full Test

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: xcodebuild-nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  full-test-plan:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.2"
      - name: Resolve simulator destination (fails if none)
        id: sim
        run: .github/scripts/resolve-sim.sh
      - name: Build and test (full tracker test plan)
        run: |
          xcodebuild test \
            -scheme tracker \
            -destination "${{ steps.sim.outputs.destination }}" \
            -testPlan tracker \
            CODE_SIGNING_ALLOWED=NO
