name: Xcode Build & Test

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: xcodebuild-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.2"
      - name: Resolve simulator destination (fails if none)
        id: sim
        run: .github/scripts/resolve-sim.sh
      - name: Build and test (unit)
        run: |
          xcodebuild test \
            -scheme tracker \
            -destination "${{ steps.sim.outputs.destination }}" \
            -testPlan tracker \
            -only-testing:trackerTests \
            CODE_SIGNING_ALLOWED=NO

  ui-tests:
    runs-on: macos-26
    # NON-BLOCKING: UI smoke tests are flaky on CI simulators; failures are
    # reported but must not fail the workflow. Remove continue-on-error to gate.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.2"
      - name: Resolve simulator destination (fails if none)
        id: sim
        run: .github/scripts/resolve-sim.sh
      - name: UI smoke tests (non-blocking)
        run: |
          xcodebuild test \
            -scheme tracker \
            -destination "${{ steps.sim.outputs.destination }}" \
            -only-testing:trackerUITests/OnboardingSkipTests \
            -only-testing:trackerUITests/WorkoutFlowTests \
            -only-testing:trackerUITests/TrainingHubFlowTests \
            CODE_SIGNING_ALLOWED=NO
